[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lgf-proyecto-despliegue"
version = "0.1.0"
description = "Proyecto reducido LGF para ventas generales y forecast SOLIDO con MLflow."
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "scikit-learn>=1.4,<2",
  "mlflow>=2.12,<3",
  "fastapi>=0.111,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3",
  "python-multipart>=0.0.9,<1",
  "matplotlib>=3.8,<4",
  "dvc>=3.0,<4",
  "jupyter>=1.1,<2",
]

[tool.setuptools.packages.find]
where = ["src"]
