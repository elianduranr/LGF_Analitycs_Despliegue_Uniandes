[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lgf-proyecto-despliegue"
version = "0.1.0"
description = "Proyecto reducido LGF para ventas generales y forecast SOLIDO con MLflow."
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "mlflow>=2.12",
  "matplotlib>=3.8",
  "dvc>=3.0",
  "jupyter>=1.1",
]

[tool.setuptools.packages.find]
where = ["src"]
