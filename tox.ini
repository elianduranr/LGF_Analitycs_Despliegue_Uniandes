[tox]
envlist = test_package, test_app
skipsdist = true

[testenv]
setenv =
    PYTHONPATH = {toxinidir}/src
    LGF_DATA_DIR = {toxinidir}/datos/raw
    LGF_DATA_PATH = {toxinidir}/datos/raw/historic_sales_acum.csv
    LGF_OUTPUT_DIR = {toxinidir}/outputs
    MLFLOW_TRACKING_URI = file:{toxinidir}/mlruns
deps =
    -r requirements-dev.txt

[testenv:train]
description = Entrena/evalua modelos y registra experimentos en MLflow.
commands =
    python scripts/train_pipeline.py

[testenv:test_package]
description = Pruebas del paquete de modelo/transformaciones.
commands =
    pytest tests/test_prediction.py

[testenv:test_api]
description = Pruebas de contrato de la API.
commands =
    pytest tests/test_api_contract.py

[testenv:run]
description = Ejecuta la API en el puerto 8001, como en el taller de API.
commands =
    uvicorn app.main:app --host 0.0.0.0 --port 8001
